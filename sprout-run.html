<title>Sprout Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600&display=swap">
<style>
/* Layout: one centered arcade screen at a fixed 480x272 pixel grid, legend + touch pad underneath. Single dusk-arcade look. */
:root{
  --bg:#141526;
  --panel:#1e2038;
  --fg:#ece8f7;
  --muted:#a3a2c4;
  --accent:#ffb347;
  --key:#2b2e4d;
  --keyEdge:#0d0e1c;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --body:"Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:14px;
  box-sizing:border-box; margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  overflow-x:hidden;
}
.stage{
  width:min(100%, 1024px, max(300px, calc((100vh - 170px) * 1.7647)));
  aspect-ratio:480 / 272; max-width:100%;
  position:relative;
}
canvas{
  display:block; width:100%; height:100%;
  image-rendering:pixelated; image-rendering:crisp-edges;
  border-radius:6px; outline:none;
  box-shadow:0 0 0 3px var(--keyEdge), 0 0 0 5px var(--key), 0 18px 40px -12px #000;
  touch-action:none; cursor:pointer;
}
canvas:focus-visible{ box-shadow:0 0 0 3px var(--keyEdge), 0 0 0 5px var(--accent), 0 18px 40px -12px #000; }
.bar{
  width:min(100%, 1024px, max(300px, calc((100vh - 170px) * 1.7647)));
  display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; justify-content:space-between;
  color:var(--muted);
}
.legend{ display:flex; flex-wrap:wrap; gap:8px 18px; margin:0; padding:0; list-style:none; }
.legend li{ display:flex; align-items:center; gap:6px; }
kbd{
  font-family:var(--pixel); font-size:9px; color:var(--fg);
  background:var(--key); border:1px solid var(--keyEdge); border-bottom-width:3px;
  border-radius:4px; padding:4px 6px 3px; line-height:1;
}
.btns{ display:flex; gap:8px; }
button{
  font-family:var(--pixel); font-size:9px; letter-spacing:.04em;
  color:var(--fg); background:var(--panel); border:1px solid var(--key);
  border-radius:4px; padding:8px 10px; cursor:pointer;
}
button:hover{ border-color:var(--accent); }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.touch{ display:none; width:min(100%, 1024px); justify-content:space-between; gap:12px; user-select:none; -webkit-user-select:none; }
.touch .grp{ display:flex; gap:12px; }
.touch button{ width:64px; height:64px; font-size:14px; border-radius:50%; touch-action:none; background:var(--key); border:2px solid var(--keyEdge); }
.touch button.on{ background:var(--accent); color:var(--bg); }
@media (pointer:coarse){ .touch{ display:flex; } .legend{ display:none; } }
</style>

<div class="stage">
  <canvas id="game" width="960" height="544" tabindex="0" aria-label="Sprout Run game screen. Press Enter to start."></canvas>
</div>

<div class="touch" aria-hidden="true">
  <div class="grp">
    <button data-act="left" aria-label="Move left">◀</button>
    <button data-act="right" aria-label="Move right">▶</button>
  </div>
  <div class="grp">
    <button data-act="run" aria-label="Run">B</button>
    <button data-act="jump" aria-label="Jump">A</button>
  </div>
</div>

<div class="bar">
  <ul class="legend">
    <li><kbd>←</kbd><kbd>→</kbd> move</li>
    <li><kbd>Space</kbd><kbd>Z</kbd> jump (hold = higher)</li>
    <li><kbd>Shift</kbd><kbd>X</kbd> run</li>
    <li><kbd>Enter</kbd> start</li>
  </ul>
  <div class="btns">
    <button id="restartBtn" type="button">Restart</button>
    <button id="muteBtn" type="button" aria-pressed="false">Sound on</button>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 480, H = 272, T = 16, COLS = 30, ROWS = 17;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let S = 2;

function resize() {
  const r = cvs.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  S = Math.max(1, Math.ceil((r.width || W * 2) * dpr / W));
  cvs.width = W * S; cvs.height = H * S;
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(cvs);
addEventListener('resize', resize);
resize();
if (document.fonts && document.fonts.load) { document.fonts.load('8px "Press Start 2P"').catch(() => {}); }

// ---------- Palette ----------
const C = {
  hood:'#3fc1b0', hoodL:'#8beadb', hoodD:'#22786e', skin:'#ffd2a8', cheek:'#ff9a8a', eye:'#1b1530',
  scarf:'#ff6b4a', scarfD:'#c8432c', boot:'#3b2a4a', leaf:'#8fe36b', leafD:'#4fae4a',
  grass:'#6fd08a', grassL:'#b4f5bb', dirt:'#9a5f3c', dirtD:'#6e3f28', dirtL:'#b97a50',
  brick:'#c4673f', brickL:'#ec9a6a', mortar:'#5a2a22',
  rune:'#f2b134', runeL:'#ffe7a0', runeD:'#a8641a', runeO:'#4a2a0c',
  used:'#6e5648', usedD:'#3e2c26', usedL:'#8c7262',
  stone:'#8b8fb0', stoneL:'#c6cae4', stoneD:'#545979',
  shell:'#9b5de5', shellL:'#d4b0ff', shellD:'#5b2f9a', bug:'#1b1530',
  coin:'#ffd447', coinD:'#c98a14', coinL:'#fff6c0',
  berry:'#ff4f7b', berryL:'#ffc2d2', berryD:'#b02a52',
  plank:'#d59a5e', plankD:'#8a5a32', plankL:'#f3c58f',
  text:'#fff4e0', shadow:'#1b1530'
};

// ---------- Level (one screen, 30 x 17 tiles) ----------
//  #ground  B brick  ? rune block (coin)  * rune block (berry)  S stone  o coin  b beetle
const LEVEL = [
  "..............................",
  "..............................",
  "..............................",
  "..............................",
  "..............ooooo...........",
  "..............BBBBB...........",
  "..............................",
  "..........................o...",
  "....o.o.o.............b...o...",
  "....................B?BB......",
  "..............................",
  "...B?B*B.......o..o...........",
  "..........................S...",
  ".........................SS...",
  "......b.......b.b.......SSS...",
  "#########...######...#########",
  "#########...######...#########",
];
const SOLID = new Set(['#','B','?','*','S','U']);
const PORTAL = { x: 450, y: 192, w: 28, h: 48 };

// ---------- State ----------
let tiles, enemies, coins, items, parts, pops, plat, player, bumps;
let state = 'title', stateT = 0, frame = 0, timeF = 0;
let score = 0, coinCount = 0, lives = 3, clearInfo = null;
let best = null;
try { const b = parseFloat(localStorage.getItem('sprout-run-best')); if (b > 0) best = b; } catch (e) {}

function loadLevel() {
  tiles = LEVEL.map(r => r.split(''));
  enemies = []; coins = []; items = []; parts = []; pops = []; bumps = {};
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = tiles[y][x];
    if (c === 'o') { coins.push({ x: x*T + 4, y: y*T + 3, w: 8, h: 10 }); tiles[y][x] = '.'; }
    else if (c === 'b') { enemies.push({ x: x*T + 1, y: y*T + 4, w: 14, h: 12, vx: -0.45, vy: 0, st: 'walk', t: 0 }); tiles[y][x] = '.'; }
  }
  plat = { x: 290, y: 170, w: 28, h: 6, base: 170, amp: 58, t: 0, dy: 0 };
  player = { x: 24, y: 240 - 14, w: 12, h: 14, vx: 0, vy: 0, vyPre: 0, onGround: true, onPlat: false,
             facing: 1, big: false, inv: 0, coyote: 0, jumpBuf: 0, anim: 0, jumping: false };
  timeF = 0;
}
loadLevel();

const tileAt = (tx, ty) => (tx < 0 || tx >= COLS) ? '#' : (ty < 0 || ty >= ROWS) ? '.' : tiles[ty][tx];
const solidAt = (tx, ty) => SOLID.has(tileAt(tx, ty));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function moveX(o) {
  o.x += o.vx;
  const top = Math.floor(o.y / T), bot = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0) {
    const tx = Math.floor((o.x + o.w - 0.01) / T);
    for (let ty = top; ty <= bot; ty++) if (solidAt(tx, ty)) { o.x = tx*T - o.w; return 1; }
  } else if (o.vx < 0) {
    const tx = Math.floor(o.x / T);
    for (let ty = top; ty <= bot; ty++) if (solidAt(tx, ty)) { o.x = (tx + 1)*T; return -1; }
  }
  return 0;
}
function moveY(o) {
  o.y += o.vy;
  const l = Math.floor(o.x / T), r = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0) {
    const ty = Math.floor((o.y + o.h - 0.01) / T);
    for (let tx = l; tx <= r; tx++) if (solidAt(tx, ty)) { o.y = ty*T - o.h; return { floor: true }; }
  } else if (o.vy < 0) {
    const ty = Math.floor(o.y / T);
    let bestTx = null, bestOv = 0;
    for (let tx = l; tx <= r; tx++) if (solidAt(tx, ty)) {
      const ov = Math.min(o.x + o.w, (tx + 1)*T) - Math.max(o.x, tx*T);
      if (ov > bestOv) { bestOv = ov; bestTx = tx; }
    }
    if (bestTx !== null) { o.y = (ty + 1)*T; return { ceil: true, tx: bestTx, ty }; }
  }
  return null;
}

// ---------- Input ----------
const input = { left:false, right:false, jump:false, run:false };
const pressed = { jump:false };
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump', KeyK:'jump',
  ShiftLeft:'run', ShiftRight:'run', KeyX:'run', KeyJ:'run', ArrowDown:'down', KeyS:'down' };

function press(a) {
  if (a === 'jump' && (state === 'title' || state === 'over' || (state === 'clear' && stateT > 70))) { start(); return; }
  if (!input[a] && a === 'jump') pressed.jump = true;
  input[a] = true;
}
function release(a) { input[a] = false; }

addEventListener('keydown', e => {
  audioInit();
  const a = KEYMAP[e.code];
  if (a) { e.preventDefault(); if (!e.repeat) press(a); return; }
  if (e.code === 'Enter') { e.preventDefault(); if (state !== 'play' && state !== 'dying') start(); }
  else if (e.code === 'KeyR') start();
  else if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); release(a); } });
addEventListener('blur', () => { for (const k in input) input[k] = false; });

cvs.addEventListener('pointerdown', () => {
  cvs.focus(); audioInit();
  if (state === 'title' || state === 'over' || (state === 'clear' && stateT > 70)) start();
});
document.querySelectorAll('.touch button').forEach(b => {
  const a = b.dataset.act;
  const down = e => { e.preventDefault(); audioInit(); b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} press(a); };
  const up = e => { e.preventDefault(); b.classList.remove('on'); release(a); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
document.getElementById('restartBtn').addEventListener('click', () => { audioInit(); start(); cvs.focus(); });
const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => { audioInit(); toggleMute(); cvs.focus(); });

// ---------- Audio ----------
let ac = null, muted = false;
function audioInit() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
}
function toggleMute() {
  muted = !muted;
  muteBtn.textContent = muted ? 'Sound off' : 'Sound on';
  muteBtn.setAttribute('aria-pressed', String(muted));
}
function tone(f0, f1, dur, type = 'square', vol = 0.05, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const notes = (list, gap, type = 'square', vol = 0.05, len = 0.12) => list.forEach((f, i) => tone(f, 0, len, type, vol, i * gap));
const sfx = {
  jump:   () => tone(240, 640, 0.16, 'square', 0.04),
  coin:   () => { tone(988, 0, 0.07, 'square', 0.04); tone(1319, 0, 0.28, 'square', 0.04, 0.07); },
  stomp:  () => tone(420, 80, 0.14, 'triangle', 0.14),
  bump:   () => tone(150, 90, 0.08, 'triangle', 0.14),
  brk:    () => { tone(220, 50, 0.18, 'sawtooth', 0.06); tone(120, 40, 0.2, 'triangle', 0.1, 0.02); },
  sprout: () => tone(260, 900, 0.45, 'triangle', 0.08),
  grow:   () => notes([523, 659, 784, 1047, 1319], 0.06, 'square', 0.04),
  shrink: () => notes([784, 587, 440, 330], 0.07, 'square', 0.04),
  die:    () => notes([659, 523, 392, 330, 262, 196], 0.11, 'triangle', 0.1, 0.16),
  win:    () => notes([392, 523, 659, 784, 1047, 784, 1047, 1319], 0.09, 'square', 0.045, 0.16),
  over:   () => notes([330, 311, 294, 262], 0.25, 'triangle', 0.1, 0.3),
};

// ---------- Game flow ----------
function start() {
  score = 0; coinCount = 0; lives = 3; clearInfo = null;
  loadLevel(); state = 'play'; stateT = 0;
  for (const k in input) input[k] = false;
}
function addPop(x, y, t) { pops.push({ x, y, t, life: 45 }); }

function die() {
  if (state !== 'play') return;
  state = 'dying'; stateT = 0;
  player.vy = -6; player.vx = 0; player.inv = 0;
  sfx.die();
}
function hurt() {
  const p = player;
  if (p.big) {
    p.big = false; p.y += 10; p.h = 14; p.inv = 100; sfx.shrink();
  } else die();
}
function grow(x, y) {
  const p = player;
  score += 1000; addPop(x, y, '1000');
  if (!p.big) { p.big = true; p.y -= 10; p.h = 24; }
  sfx.grow();
}
function collectCoin(x, y) { coinCount++; score += 200; addPop(x, y, '200'); sfx.coin(); }
function knock(e) { e.st = 'flip'; e.vy = -3.5; e.vx = e.x < player.x ? -0.8 : 0.8; score += 200; addPop(e.x, e.y, '200'); sfx.stomp(); }

function bumpTile(tx, ty) {
  if (ty < 0 || ty >= ROWS) return;
  const c = tiles[ty][tx], key = tx + ',' + ty;
  if (c === '?') {
    tiles[ty][tx] = 'U'; bumps[key] = 8;
    parts.push({ k: 'coin', x: tx*T + 4, y: ty*T - 10, vx: 0, vy: -4.2, life: 30 });
    collectCoin(tx*T + 2, ty*T - 20);
  } else if (c === '*') {
    tiles[ty][tx] = 'U'; bumps[key] = 8;
    items.push({ x: tx*T + 2, y: ty*T + 2, w: 12, h: 12, vx: 0, vy: 0, emerge: 18 });
    sfx.sprout();
  } else if (c === 'B') {
    if (player.big) {
      tiles[ty][tx] = '.'; score += 50;
      for (let i = 0; i < 4; i++) parts.push({ k: 'brick', x: tx*T + 4 + (i % 2) * 8, y: ty*T + 4 + (i >> 1) * 8,
        vx: (i % 2 ? 1 : -1) * (1 + Math.random()), vy: -5 + (i >> 1) * 2, life: 90 });
      sfx.brk();
    } else { bumps[key] = 8; sfx.bump(); }
  } else sfx.bump();
  // Knock anything standing on the bumped tile
  const box = { x: tx*T, y: ty*T - 4, w: T, h: 6 };
  for (const e of enemies) if (e.st === 'walk' && overlap(e, box)) knock(e);
  for (let i = coins.length - 1; i >= 0; i--) if (overlap(coins[i], { x: tx*T, y: ty*T - 14, w: T, h: 14 })) {
    const cn = coins.splice(i, 1)[0]; collectCoin(cn.x, cn.y);
  }
}

// ---------- Updates ----------
function updatePlat() {
  plat.t++;
  const ny = plat.base + Math.sin(plat.t * 0.02) * plat.amp;
  plat.dy = ny - plat.y; plat.y = ny;
}

function updatePlayer() {
  const p = player;
  if (p.onPlat) p.y += plat.dy;

  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const max = input.run ? 2.5 : 1.5;
  const acc = p.onGround ? (input.run ? 0.14 : 0.11) : 0.085;
  if (dir) {
    if (p.onGround && p.vx * dir < 0) {
      p.vx += dir * 0.22; // skid
      if (frame % 4 === 0) parts.push({ k: 'dust', x: p.x + 6, y: p.y + p.h - 2, vx: -dir * 0.3, vy: -0.3, life: 14 });
    } else p.vx += dir * acc;
    p.facing = dir;
  } else {
    const f = p.onGround ? 0.12 : 0.03;
    p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
  }
  if (Math.abs(p.vx) > max) p.vx -= Math.sign(p.vx) * Math.min(0.1, Math.abs(p.vx) - max);

  if (pressed.jump) p.jumpBuf = 7;
  if (p.onGround) p.coyote = 6; else if (p.coyote > 0) p.coyote--;
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -(5.5 + Math.abs(p.vx) * 0.2);
    p.coyote = 0; p.jumpBuf = 0; p.onGround = false; p.onPlat = false; p.jumping = true;
    sfx.jump();
  }
  if (p.jumpBuf > 0) p.jumpBuf--;
  const g = (p.vy < 0 && input.jump && p.jumping) ? 0.22 : 0.5;
  p.vy = Math.min(p.vy + g, 7);

  if (moveX(p)) p.vx = 0;
  const prevBottom = p.y + p.h;
  p.vyPre = p.vy;
  const wasGround = p.onGround;
  const r = moveY(p);
  p.onGround = false; p.onPlat = false;
  if (r && r.floor) { p.vy = 0; p.onGround = true; p.jumping = false; }
  else if (r && r.ceil) { p.vy = 1; p.jumping = false; bumpTile(r.tx, r.ty); }

  if (p.vy >= 0 && p.x + p.w > plat.x && p.x < plat.x + plat.w && p.y + p.h >= plat.y && prevBottom <= plat.y + 4) {
    p.y = plat.y - p.h; p.vy = 0; p.onGround = true; p.onPlat = true; p.jumping = false;
  }
  if (p.onGround && !wasGround && p.vyPre > 3) {
    parts.push({ k: 'dust', x: p.x + 1, y: p.y + p.h - 2, vx: -0.5, vy: -0.2, life: 14 });
    parts.push({ k: 'dust', x: p.x + 11, y: p.y + p.h - 2, vx: 0.5, vy: -0.2, life: 14 });
  }

  if (p.onGround && Math.abs(p.vx) > 0.05) p.anim += Math.abs(p.vx) * 0.13; else if (p.onGround) p.anim = 0;
  if (p.inv > 0) p.inv--;

  if (p.y > H + 4) { die(); return; }

  if (overlap(p, { x: PORTAL.x + 8, y: PORTAL.y + 8, w: PORTAL.w - 16, h: PORTAL.h - 8 })) {
    state = 'clear'; stateT = 0;
    const secs = timeF / 60;
    const bonus = Math.max(0, Math.ceil(90 - secs)) * 50;
    score += bonus;
    const newBest = best === null || secs < best;
    if (newBest) { best = secs; try { localStorage.setItem('sprout-run-best', String(secs)); } catch (e) {} }
    clearInfo = { secs, bonus, newBest };
    sfx.win();
  }
}

function updateItems() {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.emerge > 0) { it.y -= 1; if (--it.emerge === 0) it.vx = 0.9; continue; }
    it.vy = Math.min(it.vy + 0.35, 6);
    if (moveX(it)) it.vx = -it.vx;
    const r = moveY(it);
    if (r && r.floor) it.vy = 0;
    if (it.y > H) { items.splice(i, 1); continue; }
    if (overlap(it, player)) { items.splice(i, 1); grow(it.x, it.y); }
  }
}

function updateEnemies() {
  const p = player;
  for (const e of enemies) {
    e.t++;
    if (e.st === 'walk') {
      e.vy = Math.min(e.vy + 0.4, 6);
      if (moveX(e)) e.vx = -e.vx;
      const r = moveY(e);
      if (r && r.floor) {
        e.vy = 0;
        const ax = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
        if (!solidAt(Math.floor(ax / T), Math.floor((e.y + e.h + 1) / T))) e.vx = -e.vx;
      }
      if (e.y > H) e.st = 'gone';
    } else if (e.st === 'flat') {
      if (e.t > 32) e.st = 'gone';
    } else if (e.st === 'flip') {
      e.vy += 0.3; e.y += e.vy; e.x += e.vx;
      if (e.y > H + 20) e.st = 'gone';
    }
  }
  // beetles turn around when they meet
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    if (a.st === 'walk' && b.st === 'walk' && overlap(a, b)) {
      const s = a.x < b.x ? -1 : 1;
      a.vx = s * Math.abs(a.vx); b.vx = -s * Math.abs(b.vx);
    }
  }
  // player vs beetles
  for (const e of enemies) {
    if (e.st !== 'walk' || state !== 'play' || !overlap(p, e)) continue;
    if (p.vyPre > 0 && (p.y + p.h) - e.y < 9) {
      e.st = 'flat'; e.t = 0;
      p.y = e.y - p.h;
      p.vy = input.jump ? -6.2 : -4; p.jumping = input.jump;
      score += 100; addPop(e.x, e.y - 4, '100'); sfx.stomp();
      for (let k = 0; k < 4; k++) parts.push({ k: 'dust', x: e.x + 7, y: e.y + 8, vx: (k - 1.5) * 0.7, vy: -0.6, life: 16 });
    } else if (p.inv === 0) hurt();
  }
  enemies = enemies.filter(e => e.st !== 'gone');
}

function collideCoins() {
  for (let i = coins.length - 1; i >= 0; i--) if (overlap(coins[i], player)) {
    const c = coins.splice(i, 1)[0]; collectCoin(c.x, c.y - 4);
    for (let k = 0; k < 5; k++) parts.push({ k: 'spark', x: c.x + 4, y: c.y + 5, vx: Math.cos(k * 1.26) * 1.2, vy: Math.sin(k * 1.26) * 1.2, life: 16 });
  }
}

function updateParts() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.x += q.vx; q.y += q.vy;
    if (q.k === 'brick') q.vy += 0.3;
    else if (q.k === 'coin') q.vy += 0.28;
    else q.vy *= 0.92;
    if (--q.life <= 0 || q.y > H + 10) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].y -= 0.5; if (--pops[i].life <= 0) pops.splice(i, 1); }
}

function step() {
  frame++;
  updatePlat();
  if (state === 'play') {
    timeF++;
    updatePlayer();
    if (state === 'play') { updateItems(); updateEnemies(); collideCoins(); }
  } else if (state === 'dying') {
    stateT++;
    if (stateT > 20) { player.vy = Math.min(player.vy + 0.3, 7); player.y += player.vy; }
    if (stateT > 130) {
      lives--;
      if (lives <= 0) { state = 'over'; stateT = 0; sfx.over(); }
      else { loadLevel(); state = 'play'; }
    }
  } else if (state === 'clear' || state === 'over') {
    stateT++;
    if (state === 'clear') {
      const p = player, cx = PORTAL.x + PORTAL.w / 2 - p.w / 2, cy = PORTAL.y + PORTAL.h - 8 - p.h;
      p.x += (cx - p.x) * 0.12; p.y += (cy - p.y) * 0.12;
      if (frame % 3 === 0) parts.push({ k: 'spark', x: PORTAL.x + 4 + Math.random() * 20, y: PORTAL.y + 10 + Math.random() * 36, vx: 0, vy: -0.6, life: 24 });
    }
  }
  updateParts();
  for (const k in bumps) if (--bumps[k] <= 0) delete bumps[k];
  pressed.jump = false;
}

// ---------- Drawing ----------
const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
const hash = (a, b) => (Math.imul(a * 73 + b * 151 + 17, 2654435761) >>> 0);

// Static backdrop, painted once at logical resolution
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;

  });

  b.globalAlpha = 1;

  b.fillStyle = '#ffbb84'; for (let i = 0; i < 4; i++) b.fillRect(sx - 30, sy + 4 + i * 6, 60, 2);

    b.fillStyle = '#9468b8'; b.fillRect(x, Math.round(h), 1, 1);

const clouds = [ { x: 40, y: 34, s: 0.06 }, { x: 210, y: 18, s: 0.04 }, { x: 330, y: 60, s: 0.08 }, { x: 460, y: 40, s: 0.05 } ];
function drawCloud(x, y) {
  x = Math.round(x);
  rect(x + 6, y + 6, 34, 6, '#c98aa8');
  rect(x + 4, y + 2, 14, 6, '#ffc9b8'); rect(x + 12, y - 2, 16, 8, '#ffc9b8'); rect(x + 24, y + 2, 14, 6, '#ffc9b8');
  rect(x + 2, y + 5, 40, 4, '#f6a8a8');
  rect(x + 14, y - 2, 10, 2, '#ffe2d0');
}

function drawTile(c, tx, ty) {
  const px = tx * T;
  let py = ty * T;
  const b = bumps[tx + ',' + ty];
  if (b) py -= Math.round(Math.sin((8 - b) / 8 * Math.PI) * 5);
  if (c === '#') {
    rect(px, py, 16, 16, C.dirt);
    for (let i = 0; i < 4; i++) { const h = hash(tx * 5 + i, ty * 3 + i); rect(px + h % 14, py + 5 + (h >> 7) % 10, 2, 1, C.dirtD); }
    const h2 = hash(tx, ty); rect(px + (h2 >> 3) % 14, py + 6 + (h2 >> 11) % 8, 1, 1, C.dirtL);
    if (tileAt(tx, ty - 1) !== '#') {
      rect(px, py, 16, 4, C.grass); rect(px, py, 16, 1, C.grassL);
      for (let i = 0; i < 16; i += 2) { const d = (hash(tx, i) % 3) + 1; rect(px + i, py + 4, 2, d, C.grass); }
    }
    if (tileAt(tx - 1, ty) !== '#') rect(px, py, 1, 16, C.dirtD);
    if (tileAt(tx + 1, ty) !== '#') rect(px + 15, py, 1, 16, C.dirtD);
  } else if (c === 'B') {
    rect(px, py, 16, 16, C.brick);
    rect(px, py, 16, 1, C.brickL);
    rect(px, py + 7, 16, 1, C.mortar); rect(px, py + 15, 16, 1, C.mortar);
    rect(px + 7, py, 1, 7, C.mortar); rect(px + 15, py, 1, 7, C.mortar);
    rect(px + 3, py + 8, 1, 7, C.mortar); rect(px + 11, py + 8, 1, 7, C.mortar);
    rect(px + 1, py + 8, 2, 1, C.brickL); rect(px + 4, py + 8, 7, 1, C.brickL); rect(px + 12, py + 8, 3, 1, C.brickL);
  } else if (c === '?' || c === '*') {
    rect(px, py, 16, 16, C.runeO);
    rect(px + 1, py + 1, 14, 14, C.rune);
    rect(px + 1, py + 1, 14, 1, C.runeL); rect(px + 1, py + 1, 1, 14, C.runeL);
    rect(px + 2, py + 14, 13, 1, C.runeD); rect(px + 14, py + 2, 1, 13, C.runeD);
    const glint = (frame + tx * 9) % 70 < 12;
    const g = glint ? C.runeL : C.runeD;
    rect(px + 7, py + 3, 2, 10, g); rect(px + 3, py + 7, 10, 2, g);
    rect(px + 6, py + 5, 4, 6, g); rect(px + 5, py + 6, 6, 4, g);
    rect(px + 2, py + 2, 1, 1, C.runeO); rect(px + 13, py + 2, 1, 1, C.runeO);
    rect(px + 2, py + 13, 1, 1, C.runeO); rect(px + 13, py + 13, 1, 1, C.runeO);
  } else if (c === 'U') {
    rect(px, py, 16, 16, C.usedD);
    rect(px + 1, py + 1, 14, 14, C.used);
    rect(px + 1, py + 1, 14, 1, C.usedL);
    rect(px + 2, py + 2, 1, 1, C.usedD); rect(px + 13, py + 2, 1, 1, C.usedD);
    rect(px + 2, py + 13, 1, 1, C.usedD); rect(px + 13, py + 13, 1, 1, C.usedD);
  } else if (c === 'S') {
    rect(px, py, 16, 16, C.stone);
    rect(px, py, 16, 2, C.stoneL); rect(px, py, 2, 16, C.stoneL);
    rect(px + 2, py + 14, 14, 2, C.stoneD); rect(px + 14, py + 2, 2, 14, C.stoneD);
    rect(px + 5, py + 6, 3, 1, C.stoneD); rect(px + 8, py + 7, 2, 1, C.stoneD); rect(px + 9, py + 8, 1, 2, C.stoneD);
  }
}

function sprite(x, y, w, facing) {
  // returns a rect painter that mirrors horizontally when facing left
  return (rx, ry, rw, rh, c) => { ctx.fillStyle = c; ctx.fillRect(x + (facing > 0 ? rx : w - rx - rw), y + ry, rw, rh); };
}

function drawHero(p) {
  if (state === 'play' && p.inv > 0 && (frame >> 2) % 2) return;
  const x = Math.round(p.x), y = Math.round(p.y);
  let scale = 1;
  if (state === 'clear') scale = Math.max(0, 1 - stateT / 45);
  if (scale <= 0) return;
  ctx.save();
  if (scale < 1) { const cx = x + 6, cy = y + p.h / 2; ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.rotate(stateT * 0.25); ctx.translate(-cx, -cy); }
  const R = sprite(x, y, 12, p.facing);
  const Hh = p.h, hh = p.big ? 9 : 7;
  const air = !p.onGround && state === 'play';
  const stepF = air ? -1 : (Math.abs(p.vx) > 0.05 ? Math.floor(p.anim) % 4 : 0);
  const sway = (frame >> 4) % 2;
  // sprout on the hood
  R(5, -3, 1, 3, C.leafD); R(6, -4 + sway, 3, 2, C.leaf); R(2, -3, 3, 1, C.leaf);
  // hood
  R(1, 0, 10, hh, C.hood); R(0, 1, 12, hh - 2, C.hood); R(1, 0, 9, 1, C.hoodL); R(0, 1, 1, hh - 3, C.hoodD);
  // face
  R(5, 2, 6, hh - 3, C.skin); R(4, 3, 1, hh - 5, C.skin);
  if (state === 'dying') { R(8, 3, 1, 1, C.eye); R(9, 4, 1, 1, C.eye); R(8, 5, 1, 1, C.eye); R(10, 3, 1, 1, C.eye); R(10, 5, 1, 1, C.eye); }
  else { R(8, 3, 1, 2, C.eye); R(10, hh - 3, 1, 1, C.cheek); }
  // scarf + tail
  R(1, hh, 10, 2, C.scarf); R(1, hh + 1, 10, 1, C.scarfD);
  const flap = (Math.abs(p.vx) > 1 || air) ? (frame >> 2) % 2 : 0;
  R(-2, hh + flap, 3, 2, C.scarf); R(-3, hh + 1 + flap, 1, 1, C.scarfD);
  // body
  const legH = p.big ? 4 : 2, bodyTop = hh + 2, bodyH = Hh - bodyTop - legH;
  R(2, bodyTop, 8, bodyH, C.hoodD); R(3, bodyTop, 6, 1, C.hood);
  // arm
  const armY = bodyTop + (air ? -1 : (stepF === 1 || stepF === 3 ? 1 : 0));
  R(7, armY, 3, Math.min(3, bodyH), C.hood); R(9, armY + Math.min(3, bodyH) - 1, 2, 1, C.skin);
  // legs
  const ly = Hh - legH;
  if (air) { R(1, ly - 1, 3, legH, C.boot); R(8, ly, 3, legH, C.boot); }
  else if (stepF === 1) { R(1, ly, 3, legH, C.boot); R(8, ly - 1, 3, legH, C.boot); }
  else if (stepF === 3) { R(2, ly - 1, 3, legH, C.boot); R(7, ly, 3, legH, C.boot); }
  else { R(2, ly, 3, legH, C.boot); R(7, ly, 3, legH, C.boot); }
  ctx.restore();
}

function drawBeetle(e) {
  const x = Math.round(e.x), y = Math.round(e.y);
  const facing = e.vx > 0 ? 1 : -1;
  if (e.st === 'flat') {
    const R = sprite(x, y, 14, facing);
    R(1, 7, 12, 4, C.shell); R(0, 9, 14, 3, C.shellD); R(3, 7, 3, 1, C.shellL);
    R(9, 10, 1, 1, '#fff'); R(11, 10, 1, 1, '#fff');
    return;
  }
  ctx.save();
  if (e.st === 'flip') { ctx.translate(0, y * 2 + e.h); ctx.scale(1, -1); }
  const R = sprite(x, y, 14, facing);
  const leg = (e.t >> 3) % 2;
  // legs
  R(2, 10 + leg, 2, 2 - leg, C.bug); R(6, 11 - leg, 2, 1 + leg, C.bug); R(10, 10 + leg, 2, 2 - leg, C.bug);
  // shell
  R(3, 1, 8, 1, C.shell); R(1, 2, 11, 2, C.shell); R(0, 4, 12, 5, C.shell);
  R(1, 9, 11, 1, C.shellD); R(6, 2, 1, 7, C.shellD);
  R(3, 2, 2, 2, C.shellL); R(2, 4, 1, 2, C.shellL);
  // head
  R(11, 4, 3, 5, C.bug); R(12, 5, 1, 2, '#fff'); R(13, 5, 1, 1, '#fff');
  // antennae
  R(12, 2, 1, 2, C.bug); R(13, 1, 1, 1, C.bug);
  ctx.restore();
}

function drawCoin(x, y, phase) {
  x = Math.round(x); y = Math.round(y);
  const widths = [8, 6, 2, 6], w = widths[phase % 4], ox = x + (8 - w) / 2;
  rect(ox, y + 1, w, 8, C.coinD);
  if (w > 2) { rect(ox + 1, y, w - 2, 10, C.coinD); rect(ox + 1, y + 1, w - 2, 8, C.coin); rect(ox + 1, y + 1, 1, 3, C.coinL); }
  if (w === 8) rect(ox + 3, y + 3, 2, 4, C.coinD);
}

function drawBerry(it) {
  const x = Math.round(it.x), y = Math.round(it.y);
  const R = sprite(x, y, 12, 1);
  R(3, 2, 6, 1, C.berry); R(1, 3, 10, 7, C.berry); R(2, 10, 8, 1, C.berry); R(3, 11, 6, 1, C.berryD);
  R(1, 8, 10, 2, C.berryD); R(3, 4, 2, 2, C.berryL); R(7, 5, 1, 1, C.berryL);
  R(5, 0, 1, 3, C.leafD); R(6, 0, 3, 2, C.leaf);
}

function drawPortal() {
  const { x, y, w, h } = PORTAL;
  // swirling core
  const cols = ['#24195a', '#5b3fd0', '#9b7cff', '#8fe8ff'];
  for (let i = 0; i < 6; i++) {
    const c = cols[(i + (frame >> 3)) % cols.length];
    const ix = x + 4 + i * 2, iy = y + 6 + i * 2, iw = w - 8 - i * 4, ih = h - 6 - i * 3;
    if (iw <= 0 || ih <= 0) break;

  rect(x, y + 6, 4, h - 6, C.stoneD); rect(x + w - 4, y + 6, 4, h - 6, C.stoneD);
  rect(x + 4, y, w - 8, 4, C.stoneD); rect(x + 2, y + 2, 4, 6, C.stoneD); rect(x + w - 6, y + 2, 4, 6, C.stoneD);
  rect(x + 1, y + 7, 2, h - 8, C.stone); rect(x + w - 3, y + 7, 2, h - 8, C.stone); rect(x + 5, y + 1, w - 10, 2, C.stoneL);

function drawPlat() {

  rect(x + 3, y + 2, 1, 1, C.plankD); rect(x + plat.w - 4, y + 2, 1, 1, C.plankD);
}

function drawHeart(x, y) {

function text(str, x, y, size = 8, color = C.text, align = 'left') {

}

function fmtTime(s) { const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); }

function drawHUD() {

function drawOverlay() {
  const blink = (frame >> 5) % 2 === 0;
  if (state === 'title') {
    panel(110, 66, 260, 116);

function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bg, 0, 0);
  for (const c of clouds) { const x = ((c.x + frame * c.s) % (W + 60)) - 50; drawCloud(x, c.y); }

  drawPortal();
  for (const it of items) drawBerry(it);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const c = tiles[y][x]; if (c !== '.') drawTile(c, x, y); }
  drawPlat();
  coins.forEach((c, i) => drawCoin(c.x, c.y + Math.round(Math.sin(frame * 0.06 + i) * 1), ((frame >> 3) + i) % 4));
  for (const e of enemies) drawBeetle(e);
  drawHero(player);

  for (const q of parts) {
    if (q.k === 'brick') { rect(Math.round(q.x), Math.round(q.y), 5, 5, C.brick); rect(Math.round(q.x), Math.round(q.y), 5, 1, C.brickL); }
    else if (q.k === 'coin') drawCoin(q.x, q.y, (frame >> 1) % 4);
    else if (q.k === 'dust') { ctx.globalAlpha = q.life / 16; rect(Math.round(q.x) - 1, Math.round(q.y) - 1, 3, 3, '#fff1e0'); ctx.globalAlpha = 1; }
    else if (q.k === 'spark') { ctx.globalAlpha = Math.min(1, q.life / 12); rect(Math.round(q.x), Math.round(q.y), 2, 2, '#fff6c0'); ctx.globalAlpha = 1; }
  }
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.life / 15); text(p.t, Math.round(p.x), Math.round(p.y), 8, '#fff6c0'); ctx.globalAlpha = 1; }

  drawHUD();
  drawOverlay();
}

// ---------- Loop ----------
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
})();
</script>
